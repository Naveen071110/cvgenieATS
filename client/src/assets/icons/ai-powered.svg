
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0050B3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sparkleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- AI Brain -->
  <path d="M80,30 C100,30 115,45 115,65 C115,75 110,84 103,90 C108,95 110,102 108,108 C106,115 100,120 92,120 L68,120 C60,120 54,115 52,108 C50,102 52,95 57,90 C50,84 45,75 45,65 C45,45 60,30 80,30 Z" fill="url(#brainGradient)"/>
  
  <!-- Neural network lines -->
  <circle cx="65" cy="55" r="3" fill="white" opacity="0.9"/>
  <circle cx="80" cy="45" r="3" fill="white" opacity="0.9"/>
  <circle cx="95" cy="55" r="3" fill="white" opacity="0.9"/>
  <circle cx="70" cy="70" r="3" fill="white" opacity="0.9"/>
  <circle cx="90" cy="70" r="3" fill="white" opacity="0.9"/>
  
  <line x1="65" y1="55" x2="80" y2="45" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="80" y1="45" x2="95" y2="55" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="55" x2="70" y2="70" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="95" y1="55" x2="90" y2="70" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="70" x2="90" y2="70" stroke="white" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Magic sparkles -->
  <g opacity="0.8">
    <path d="M130,40 L132,44 L136,42 L132,46 L130,50 L128,46 L124,42 L128,44 Z" fill="url(#sparkleGradient)">
      <animateTransform attributeName="transform" type="rotate" values="0 130 45; 360 130 45" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M25,70 L27,74 L31,72 L27,76 L25,80 L23,76 L19,72 L23,74 Z" fill="url(#sparkleGradient)">
      <animateTransform attributeName="transform" type="rotate" values="360 25 75; 0 25 75" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M140,90 L142,94 L146,92 L142,96 L140,100 L138,96 L134,92 L138,94 Z" fill="url(#sparkleGradient)">
      <animateTransform attributeName="transform" type="rotate" values="0 140 95; 360 140 95" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Document transformation -->
  <rect x="40" y="125" width="25" height="30" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="45" y="130" width="15" height="2" rx="1" fill="#64748b" opacity="0.6"/>
  <rect x="45" y="135" width="12" height="1.5" rx="0.75" fill="#64748b" opacity="0.6"/>
  <rect x="45" y="139" width="18" height="1.5" rx="0.75" fill="#64748b" opacity="0.6"/>
  
  <!-- Arrow -->
  <path d="M70,140 L85,140" stroke="#0050B3" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Optimized document -->
  <rect x="95" y="125" width="25" height="30" rx="3" fill="url(#brainGradient)" opacity="0.1" stroke="#0050B3" stroke-width="2"/>
  <rect x="100" y="130" width="15" height="2" rx="1" fill="#0050B3"/>
  <rect x="100" y="135" width="12" height="1.5" rx="0.75" fill="#0050B3" opacity="0.8"/>
  <rect x="100" y="139" width="18" height="1.5" rx="0.75" fill="#0050B3" opacity="0.8"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0050B3"/>
    </marker>
  </defs>
</svg>
