
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0050B3;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0050B3;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="penGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Letter document -->
  <rect x="40" y="20" width="80" height="100" rx="6" fill="url(#letterGradient)" stroke="#0050B3" stroke-width="2"/>
  <rect x="40" y="20" width="80" height="100" rx="6" fill="white" opacity="0.9"/>
  
  <!-- Letter header -->
  <rect x="50" y="35" width="25" height="3" rx="1.5" fill="#0050B3"/>
  <rect x="50" y="42" width="35" height="2" rx="1" fill="#64748b" opacity="0.6"/>
  <rect x="50" y="47" width="30" height="2" rx="1" fill="#64748b" opacity="0.6"/>
  
  <!-- Letter body lines -->
  <rect x="50" y="60" width="60" height="2" rx="1" fill="#64748b" opacity="0.6"/>
  <rect x="50" y="65" width="55" height="2" rx="1" fill="#64748b" opacity="0.6"/>
  <rect x="50" y="70" width="58" height="2" rx="1" fill="#64748b" opacity="0.6"/>
  <rect x="50" y="75" width="52" height="2" rx="1" fill="#64748b" opacity="0.6"/>
  
  <rect x="50" y="85" width="60" height="2" rx="1" fill="#64748b" opacity="0.6"/>
  <rect x="50" y="90" width="48" height="2" rx="1" fill="#64748b" opacity="0.6"/>
  <rect x="50" y="95" width="56" height="2" rx="1" fill="#64748b" opacity="0.6"/>
  
  <!-- Signature -->
  <path d="M50,105 Q55,103 60,105 Q65,107 70,105" stroke="#0050B3" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- AI pen writing -->
  <g transform="translate(90, 75)">
    <rect x="0" y="0" width="25" height="4" rx="2" fill="url(#penGradient)"/>
    <circle cx="25" cy="2" r="3" fill="#4f46e5"/>
    <path d="M28,2 L35,2" stroke="#4f46e5" stroke-width="1.5">
      <animate attributeName="stroke-dasharray" values="0,10; 7,0; 0,10" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Sparkles around pen -->
    <circle cx="35" cy="-5" r="1.5" fill="#fbbf24">
      <animate attributeName="opacity" values="0; 1; 0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="10" r="1" fill="#fbbf24">
      <animate attributeName="opacity" values="0; 1; 0" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- AI label -->
  <rect x="15" y="130" width="20" height="12" rx="6" fill="url(#penGradient)"/>
  <text x="25" y="138" font-family="Inter" font-size="8" font-weight="600" text-anchor="middle" fill="white">AI</text>
  
  <!-- Magic wand trail -->
  <path d="M20,50 Q30,40 40,50 Q50,60 60,50" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="2,4">
    <animate attributeName="stroke-dashoffset" values="0; -12" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
