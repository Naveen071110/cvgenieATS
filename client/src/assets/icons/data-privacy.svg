
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0050B3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main shield -->
  <path d="M80,20 L65,30 L65,70 Q65,85 80,95 Q95,85 95,70 L95,30 Z" fill="url(#shieldGradient)" stroke="#047857" stroke-width="2"/>
  
  <!-- Shield highlight -->
  <path d="M80,25 L70,32 L70,68 Q70,78 80,85 Q85,82 88,78 L88,35 Z" fill="white" opacity="0.1"/>
  
  <!-- Lock icon in shield -->
  <rect x="75" y="50" width="10" height="12" rx="2" fill="url(#lockGradient)"/>
  <path d="M75,50 Q75,45 80,45 Q85,45 85,50" stroke="url(#lockGradient)" stroke-width="2" fill="none"/>
  <circle cx="80" cy="56" r="2" fill="white"/>
  
  <!-- Data particles around shield -->
  <circle cx="45" cy="45" r="3" fill="#0050B3" opacity="0.6">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="60" r="3" fill="#0050B3" opacity="0.6">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="80" r="3" fill="#0050B3" opacity="0.6">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="40" r="3" fill="#0050B3" opacity="0.6">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Protected data flow -->
  <path d="M45,45 Q60,35 75,45" stroke="#10b981" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="4,4">
    <animate attributeName="stroke-dashoffset" values="0; -8" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Privacy text -->
  <text x="80" y="120" font-family="Inter" font-size="10" font-weight="600" text-anchor="middle" fill="#059669">Secure & Private</text>
  <text x="80" y="135" font-family="Inter" font-size="8" text-anchor="middle" fill="#64748b">No Data Stored</text>
</svg>
