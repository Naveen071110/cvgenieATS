
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="uploadGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0050B3;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0050B3;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Upload zone -->
  <rect x="30" y="40" width="100" height="80" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Cloud upload -->
  <ellipse cx="80" cy="65" rx="20" ry="12" fill="#0050B3" opacity="0.1"/>
  <path d="M60,65 Q60,55 70,55 Q80,45 90,55 Q100,55 100,65 Q100,75 90,75 L70,75 Q60,75 60,65" fill="#0050B3" opacity="0.2"/>
  
  <!-- Upload arrow -->
  <line x1="80" y1="85" x2="80" y2="65" stroke="#0050B3" stroke-width="3" stroke-linecap="round"/>
  <path d="M75,70 L80,65 L85,70" stroke="#0050B3" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- File types -->
  <rect x="45" y="95" width="20" height="15" rx="2" fill="#dc2626" opacity="0.1" stroke="#dc2626"/>
  <text x="55" y="105" font-family="Inter" font-size="7" font-weight="600" text-anchor="middle" fill="#dc2626">PDF</text>
  
  <rect x="70" y="95" width="20" height="15" rx="2" fill="#2563eb" opacity="0.1" stroke="#2563eb"/>
  <text x="80" y="105" font-family="Inter" font-size="7" font-weight="600" text-anchor="middle" fill="#2563eb">DOC</text>
  
  <rect x="95" y="95" width="20" height="15" rx="2" fill="#059669" opacity="0.1" stroke="#059669"/>
  <text x="105" y="105" font-family="Inter" font-size="7" font-weight="600" text-anchor="middle" fill="#059669">TXT</text>
  
  <!-- Floating plus signs -->
  <text x="40" y="50" font-family="Inter" font-size="12" font-weight="300" fill="#0050B3" opacity="0.5">+</text>
  <text x="115" y="85" font-family="Inter" font-size="12" font-weight="300" fill="#0050B3" opacity="0.5">+</text>
  
  <!-- Upload text -->
  <text x="80" y="135" font-family="Inter" font-size="9" font-weight="600" text-anchor="middle" fill="#64748b">Drop files here</text>
</svg>
