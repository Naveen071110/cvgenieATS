
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="targetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Target background -->
  <circle cx="80" cy="80" r="50" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Target rings -->
  <circle cx="80" cy="80" r="40" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.5"/>
  <circle cx="80" cy="80" r="25" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.7"/>
  <circle cx="80" cy="80" r="12" fill="url(#targetGradient)" opacity="0.2" stroke="url(#targetGradient)" stroke-width="2"/>
  
  <!-- Bullseye center -->
  <circle cx="80" cy="80" r="6" fill="url(#targetGradient)"/>
  
  <!-- Arrow hitting target -->
  <g transform="translate(45, 45) rotate(45 0 0)">
    <rect x="0" y="-1" width="30" height="2" fill="#0050B3"/>
    <polygon points="30,-3 36,0 30,3" fill="#0050B3"/>
    <rect x="0" y="-2" width="8" height="1" fill="#ef4444"/>
    <rect x="0" y="1" width="8" height="1" fill="#ef4444"/>
  </g>
  
  <!-- Job posting elements around target -->
  <rect x="20" y="20" width="25" height="15" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="32.5" y="30" font-family="Inter" font-size="6" text-anchor="middle" fill="#0050B3">Job Post</text>
  
  <rect x="115" y="125" width="25" height="15" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="127.5" y="135" font-family="Inter" font-size="6" text-anchor="middle" fill="#0050B3">Skills</text>
  
  <rect x="15" y="120" width="25" height="15" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="27.5" y="130" font-family="Inter" font-size="6" text-anchor="middle" fill="#0050B3">Experience</text>
  
  <!-- Match percentage -->
  <circle cx="80" cy="140" r="15" fill="url(#targetGradient)"/>
  <text x="80" y="136" font-family="Inter" font-size="8" font-weight="700" text-anchor="middle" fill="white">MATCH</text>
  <text x="80" y="146" font-family="Inter" font-size="10" font-weight="700" text-anchor="middle" fill="white">95%</text>
</svg>
