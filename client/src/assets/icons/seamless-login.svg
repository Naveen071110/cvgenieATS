
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loginGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0050B3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Login form container -->
  <rect x="40" y="30" width="80" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Form header -->
  <circle cx="80" cy="50" r="15" fill="url(#loginGradient)" opacity="0.1"/>
  <circle cx="80" cy="50" r="8" fill="url(#loginGradient)"/>
  <path d="M76,47 Q76,44 80,44 Q84,44 84,47 L84,50 L76,50 Z" fill="white"/>
  <rect x="78" y="50" width="4" height="6" fill="white"/>
  
  <!-- Form fields -->
  <rect x="50" y="75" width="60" height="8" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="55" cy="79" r="2" fill="#64748b" opacity="0.4"/>
  <text x="60" y="81" font-family="Inter" font-size="6" fill="#64748b">Email</text>
  
  <rect x="50" y="90" width="60" height="8" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="55" cy="94" r="2" fill="#64748b" opacity="0.4"/>
  <rect x="60" y="92" width="8" height="4" rx="1" fill="#64748b" opacity="0.4"/>
  
  <!-- Login button -->
  <rect x="50" y="105" width="60" height="12" rx="6" fill="url(#loginGradient)"/>
  <text x="80" y="113" font-family="Inter" font-size="8" font-weight="600" text-anchor="middle" fill="white">Sign In</text>
  
  <!-- One-click options -->
  <rect x="45" y="140" width="30" height="10" rx="5" fill="#ea4335" opacity="0.9"/>
  <text x="60" y="147" font-family="Inter" font-size="6" font-weight="600" text-anchor="middle" fill="white">Google</text>
  
  <rect x="85" y="140" width="30" height="10" rx="5" fill="#1877f2" opacity="0.9"/>
  <text x="100" y="147" font-family="Inter" font-size="6" font-weight="600" text-anchor="middle" fill="white">LinkedIn</text>
  
  <!-- Speed lines -->
  <path d="M25,80 L35,80" stroke="#10b981" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M125,90 L135,90" stroke="#10b981" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </path>
  
  <text x="80" y="20" font-family="Inter" font-size="8" font-weight="600" text-anchor="middle" fill="#64748b">Quick & Easy</text>
</svg>
