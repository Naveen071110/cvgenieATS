
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="speedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Speedometer background -->
  <path d="M80,130 A50,50 0 1,1 80,30" fill="white" stroke="#e2e8f0" stroke-width="3"/>
  
  <!-- Speed marks -->
  <g stroke="#cbd5e1" stroke-width="2" opacity="0.6">
    <line x1="40" y1="80" x2="45" y2="80"/>
    <line x1="45" y1="55" x2="49" y2="58"/>
    <line x1="60" y1="38" x2="62" y2="43"/>
    <line x1="80" y1="32" x2="80" y2="37"/>
    <line x1="100" y1="38" x2="98" y2="43"/>
    <line x1="115" y1="55" x2="111" y2="58"/>
    <line x1="120" y1="80" x2="115" y2="80"/>
  </g>
  
  <!-- Active speed indicators -->
  <g stroke="url(#speedGradient)" stroke-width="3">
    <line x1="100" y1="38" x2="98" y2="43"/>
    <line x1="115" y1="55" x2="111" y2="58"/>
    <line x1="120" y1="80" x2="115" y2="80"/>
  </g>
  
  <!-- Speedometer needle -->
  <line x1="80" y1="80" x2="105" y2="65" stroke="#0050B3" stroke-width="3" stroke-linecap="round"/>
  <circle cx="80" cy="80" r="5" fill="#0050B3"/>
  
  <!-- Center display -->
  <text x="80" y="95" font-family="Inter" font-size="12" font-weight="700" text-anchor="middle" fill="#0050B3">FAST</text>
  <text x="80" y="105" font-family="Inter" font-size="7" text-anchor="middle" fill="#64748b">3 min avg</text>
  
  <!-- Speed lines -->
  <g opacity="0.6">
    <path d="M25,60 L35,60" stroke="url(#speedGradient)" stroke-width="2">
      <animate attributeName="opacity" values="0.6; 1; 0.6" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M25,80 L40,80" stroke="url(#speedGradient)" stroke-width="3">
      <animate attributeName="opacity" values="0.6; 1; 0.6" dur="1s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M25,100 L35,100" stroke="url(#speedGradient)" stroke-width="2">
      <animate attributeName="opacity" values="0.6; 1; 0.6" dur="1s" begin="0.4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Clock -->
  <circle cx="125" cy="35" r="12" fill="white" stroke="#0050B3" stroke-width="2"/>
  <line x1="125" y1="30" x2="125" y2="35" stroke="#0050B3" stroke-width="2"/>
  <line x1="125" y1="35" x2="130" y2="38" stroke="#0050B3" stroke-width="1.5"/>
</svg>
