
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Speech bubble -->
  <path d="M30,40 L130,40 Q140,40 140,50 L140,80 Q140,90 130,90 L85,90 L75,105 L80,90 L40,90 Q30,90 30,80 L30,50 Q30,40 40,40 Z" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Quote marks -->
  <text x="45" y="65" font-family="serif" font-size="20" font-weight="bold" fill="#0050B3" opacity="0.3">"</text>
  <text x="115" y="85" font-family="serif" font-size="20" font-weight="bold" fill="#0050B3" opacity="0.3">"</text>
  
  <!-- 5-star rating -->
  <g transform="translate(55, 55)">
    <path d="M10,2 L12,8 L18,8 L13,12 L15,18 L10,14 L5,18 L7,12 L2,8 L8,8 Z" fill="url(#starGradient)"/>
    <path d="M22,2 L24,8 L30,8 L25,12 L27,18 L22,14 L17,18 L19,12 L14,8 L20,8 Z" fill="url(#starGradient)"/>
    <path d="M34,2 L36,8 L42,8 L37,12 L39,18 L34,14 L29,18 L31,12 L26,8 L32,8 Z" fill="url(#starGradient)"/>
    <path d="M46,2 L48,8 L54,8 L49,12 L51,18 L46,14 L41,18 L43,12 L38,8 L44,8 Z" fill="url(#starGradient)"/>
    <path d="M58,2 L60,8 L66,8 L61,12 L63,18 L58,14 L53,18 L55,12 L50,8 L56,8 Z" fill="url(#starGradient)"/>
  </g>
  
  <!-- User avatars -->
  <circle cx="40" cy="125" r="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="40" cy="120" r="4" fill="#64748b"/>
  <path d="M32,132 Q32,128 40,128 Q48,128 48,132" fill="#64748b"/>
  
  <circle cx="80" cy="125" r="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="80" cy="120" r="4" fill="#64748b"/>
  <path d="M72,132 Q72,128 80,128 Q88,128 88,132" fill="#64748b"/>
  
  <circle cx="120" cy="125" r="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="120" cy="120" r="4" fill="#64748b"/>
  <path d="M112,132 Q112,128 120,128 Q128,128 128,132" fill="#64748b"/>
  
  <!-- Success indicators -->
  <circle cx="45" cy="110" r="5" fill="url(#starGradient)" opacity="0.8"/>
  <text x="45" y="114" font-family="Inter" font-size="6" font-weight="600" text-anchor="middle" fill="white">✓</text>
  
  <circle cx="115" cy="110" r="5" fill="url(#starGradient)" opacity="0.8"/>
  <text x="115" y="114" font-family="Inter" font-size="6" font-weight="600" text-anchor="middle" fill="white">✓</text>
</svg>
