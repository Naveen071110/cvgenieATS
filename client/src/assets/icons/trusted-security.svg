
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trustGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0050B3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Trust badge circle -->
  <circle cx="80" cy="80" r="45" fill="white" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="80" cy="80" r="35" fill="url(#trustGradient)" opacity="0.1"/>
  
  <!-- Shield in center -->
  <path d="M80,50 L70,55 L70,80 Q70,90 80,95 Q90,90 90,80 L90,55 Z" fill="url(#trustGradient)"/>
  
  <!-- Checkmark in shield -->
  <path d="M74,75 L78,79 L86,68" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Trust indicators around circle -->
  <circle cx="50" cy="50" r="6" fill="#10b981"/>
  <text x="50" y="54" font-family="Inter" font-size="8" font-weight="600" text-anchor="middle" fill="white">✓</text>
  
  <circle cx="110" cy="50" r="6" fill="#10b981"/>
  <text x="110" y="54" font-family="Inter" font-size="8" font-weight="600" text-anchor="middle" fill="white">✓</text>
  
  <circle cx="50" cy="110" r="6" fill="#10b981"/>
  <text x="50" y="114" font-family="Inter" font-size="8" font-weight="600" text-anchor="middle" fill="white">✓</text>
  
  <circle cx="110" cy="110" r="6" fill="#10b981"/>
  <text x="110" y="114" font-family="Inter" font-size="8" font-weight="600" text-anchor="middle" fill="white">✓</text>
  
  <!-- Labels -->
  <text x="50" y="40" font-family="Inter" font-size="6" text-anchor="middle" fill="#64748b">Secure</text>
  <text x="110" y="40" font-family="Inter" font-size="6" text-anchor="middle" fill="#64748b">Private</text>
  <text x="50" y="125" font-family="Inter" font-size="6" text-anchor="middle" fill="#64748b">Trusted</text>
  <text x="110" y="125" font-family="Inter" font-size="6" text-anchor="middle" fill="#64748b">Verified</text>
  
  <!-- Pulse effect -->
  <circle cx="80" cy="80" r="35" fill="none" stroke="url(#trustGradient)" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="35; 40; 35" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3; 0; 0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
